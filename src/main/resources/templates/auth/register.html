<!DOCTYPE html>
<html data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{auth.register.title} + ' | National Team Manager'"></title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="d-flex justify-content-between align-items-start gap-2">
            <div class="brand">
                <span class="brand-mark"><i class="bi bi-trophy-fill"></i></span>
                <span>National Team<small>Manager</small></span>
            </div>
            <div th:replace="~{fragments :: languageSwitcher}"></div>
        </div>
        <h1 class="h4 mb-3" th:text="#{auth.register.title}"></h1>

        <form th:action="@{/register}" th:object="${registration}" method="post" novalidate>
            <div th:replace="~{fragments :: globalErrors}"></div>
            <div class="mb-3">
                <label class="form-label" for="fullName" th:text="#{auth.fullName}"></label>
                <input class="form-control" th:field="*{fullName}" th:errorclass="is-invalid" autocomplete="name">
                <div th:replace="~{fragments :: fieldError('fullName')}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="username" th:text="#{auth.username}"></label>
                <input class="form-control" th:field="*{username}" th:errorclass="is-invalid" autocomplete="username">
                <div th:replace="~{fragments :: fieldError('username')}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email" th:text="#{auth.email}"></label>
                <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid" autocomplete="email">
                <div th:replace="~{fragments :: fieldError('email')}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password" th:text="#{auth.password}"></label>
                <input class="form-control" type="password" th:field="*{password}" th:errorclass="is-invalid" autocomplete="new-password">
                <div class="form-text" th:text="#{auth.passwordHint}"></div>
                <div th:replace="~{fragments :: fieldError('password')}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmPassword" th:text="#{auth.confirmPassword}"></label>
                <input class="form-control" type="password" th:field="*{confirmPassword}" th:errorclass="is-invalid" autocomplete="new-password">
                <div th:replace="~{fragments :: fieldError('confirmPassword')}"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100" th:text="#{auth.register.submit}"></button>
        </form>
        <p class="mt-3 mb-0 text-center text-secondary">
            <span th:text="#{auth.register.hasAccount}"></span> <a th:href="@{/login}" th:text="#{auth.register.loginLink}"></a>
        </p>
    </div>
</div>
</body>
</html>
