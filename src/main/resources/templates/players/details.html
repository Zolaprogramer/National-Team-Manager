<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(#{player.player}, ~{::#content})}">
<body>
<div id="content">
    <div class="page-header">
        <div>
            <h1 th:text="${player.fullName}"></h1>
            <a th:href="@{/teams/{id}(id=${player.team.id})}" th:text="${player.team.teamName}"></a>
        </div>
        <div class="actions">
            <a class="btn btn-outline-secondary" th:href="@{/players/{id}/edit(id=${player.id})}"><i class="bi bi-pencil"></i> <span th:text="#{common.edit}"></span></a>
            <form th:action="@{/players/{id}/delete(id=${player.id})}" method="post"
                  th:data-confirm="#{player.confirmDelete(${player.fullName})}">
                <button type="submit" class="btn btn-outline-danger"><i class="bi bi-trash"></i> <span th:text="#{common.delete}"></span></button>
            </form>
        </div>
    </div>

    <section class="panel" style="max-width: 760px">
        <div class="panel-body d-flex flex-wrap gap-4 align-items-start">
            <img class="avatar avatar-lg" th:alt="${player.fullName}"
                 th:src="${player.photoFileName != null} ? @{/players/{id}/photo(id=${player.id})} : @{/img/player-silhouette.svg}">
            <dl class="row mb-0 flex-grow-1" style="min-width: 240px">
                <dt class="col-6 fw-normal text-secondary" th:text="#{player.jersey}"></dt><dd class="col-6 fw-bold" th:text="${player.jerseyNumber}"></dd>
                <dt class="col-6 fw-normal text-secondary" th:text="#{player.position}"></dt><dd class="col-6" th:text="#{${player.position.messageKey}}"></dd>
                <dt class="col-6 fw-normal text-secondary" th:text="#{player.birthDate}"></dt>
                <dd class="col-6" th:text="${#temporals.format(player.birthDate, #messages.msg('format.date'))} + ' (' + ${player.age} + ')'"></dd>
                <dt class="col-6 fw-normal text-secondary" th:text="#{player.nationality}"></dt><dd class="col-6" th:text="${player.nationality}"></dd>
                <dt class="col-6 fw-normal text-secondary" th:text="#{player.heightLabel}"></dt><dd class="col-6" th:text="${player.heightCm} + ' cm'"></dd>
                <dt class="col-6 fw-normal text-secondary" th:text="#{player.club}"></dt><dd class="col-6 mb-0" th:text="${player.club} ?: '-'"></dd>
            </dl>
        </div>
    </section>
</div>
</body>
</html>
