spring.application.name=National Team Manager
server.port=8080

# Korisničko ime i lozinka dolaze iz application-local.properties ili iz varijabli okruženja
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=NationalTeamManager;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:ntm_app}
spring.datasource.password=${DB_PASSWORD:}

# Tabele kreira database/02_create_schema.sql; update dodaje samo ono što nedostaje
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY
spring.jpa.open-in-view=false
# Nazivi tabela i kolona ostaju tačno onakvi kakvi su navedeni u entitetima (Users, NationalTeams...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# NVARCHAR kolone, potrebne za ispravan prikaz slova č, ć, š, đ i ž
spring.jpa.properties.hibernate.use_nationalized_character_data=true

spring.thymeleaf.cache=false

# Fotografije igrača
app.upload-dir=uploads/player-photos
# Logotipi takmičenja idu u uploads/competitions
app.upload-root=uploads
# Tehnička granica prijema; poslovnu granicu od 2 MB provjerava PhotoStorageService i prikazuje jasnu poruku
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
